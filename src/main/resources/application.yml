spring:
  application:
    name: project
  h2:
    console:
      enabled: true
  datasource:
    name: mojaru
    generate-unique-name: false
    url: jdbc:h2:mem:mojaru
    driverClassName: org.h2.Driver
    username: sa
    password: password
    dialect: org.hibernate.dialect.H2Dialect
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always
  port: 8080
